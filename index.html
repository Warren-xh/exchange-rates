<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="以人民币为基准的实时汇率换算，可自定义货币、银行报价和目标价。">
<meta name="theme-color" content="#f1f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1620" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='8' fill='none' stroke='%23b5312a' stroke-width='5'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23b5312a' font-family='serif' font-weight='700'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<title>人民币汇率台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* 布局：一张银行牌价板 —— 顶部人民币基准行盖朱砂印，下面逐行外币；编辑时每行展开为表单，底部固定发布栏 */
:root {
  --paper: #f1f4f1;
  --surface: #ffffff;
  --surface-2: #e8ede9;
  --ink: #13263a;
  --ink-2: #4c5d6e;
  --ink-3: #7b8a98;
  --line: #d5ddd7;
  --accent: #1d5d7c;
  --accent-ink: #ffffff;
  --seal: #b5312a;
  --rise: #c23b2f;
  --fall: #1f7a4d;
  --warn: #9a6200;
  --warn-bg: #fbefd6;
  --ok-bg: #e2f2e9;
  --rise-bg: #f9e4e1;
  --shadow: 0 1px 2px rgba(19, 38, 58, 0.06), 0 8px 24px rgba(19, 38, 58, 0.06);
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1620; --surface: #142131; --surface-2: #1a2a3c; --ink: #e5ebf1; --ink-2: #a2b1c0; --ink-3: #74859a;
    --line: #253649; --accent: #6db4d8; --accent-ink: #0d1620; --seal: #e05a4f; --rise: #f0685b; --fall: #4cc58b;
    --warn: #e9ad45; --warn-bg: #3a2c12; --ok-bg: #143327; --rise-bg: #3d1d1a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1620; --surface: #142131; --surface-2: #1a2a3c; --ink: #e5ebf1; --ink-2: #a2b1c0; --ink-3: #74859a;
  --line: #253649; --accent: #6db4d8; --accent-ink: #0d1620; --seal: #e05a4f; --rise: #f0685b; --fall: #4cc58b;
  --warn: #e9ad45; --warn-bg: #3a2c12; --ok-bg: #143327; --rise-bg: #3d1d1a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: grid; gap: 18px;
}

/* 顶部：防伪纹样只在这一处 */
.masthead { position: relative; display: grid; gap: 10px; padding-block: 18px 6px; }
.guilloche { position: absolute; inset: 0 0 auto 0; height: 120px; pointer-events: none; color: var(--accent); opacity: 0.14; overflow: hidden; }
.guilloche svg { width: 100%; height: 100%; }
.brand { position: relative; display: flex; align-items: center; gap: 14px; }
.seal {
  flex: none; width: 46px; height: 46px; display: grid; place-items: center;
  border: 2px solid var(--seal); color: var(--seal); border-radius: 6px;
  font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -1px;
  transform: rotate(-4deg); box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 3px var(--seal);
}
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 5vw, 32px); line-height: 1.15; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.topline { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between; }

.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.status[data-state="fresh"] .dot { background: var(--fall); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fall) 25%, transparent); }
.status[data-state="late"] .dot { background: var(--warn); }
.status[data-state="stale"] .dot { background: var(--rise); }
.status b { color: var(--ink); font-weight: 500; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--rise); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 13px; }

.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--ink); font-size: 14px; }

/* 牌价板 */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.board-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 12px; color: var(--ink-2); letter-spacing: 0.06em; }

.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 16px; border-bottom: 1px solid var(--line); align-items: center; }
.row:last-child { border-bottom: 0; }
.cur { display: flex; align-items: center; gap: 10px; min-width: 0; }
.code { flex: none; display: inline-grid; place-items: center; min-width: 48px; height: 28px; padding: 0 6px; border-radius: 6px; background: var(--surface-2); font-family: var(--f-num); font-weight: 500; font-size: 13px; letter-spacing: 0.04em; }
.names { display: grid; min-width: 0; }
.label { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chg { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
.chg.up { color: var(--rise); background: var(--rise-bg); }
.chg.down { color: var(--fall); background: var(--ok-bg); }
.chg.flat { color: var(--ink-3); background: var(--surface-2); }
.spark { width: 84px; height: 22px; flex: none; }
.spark path.l { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.spark path.a { fill: color-mix(in srgb, var(--ink-2) 12%, transparent); stroke: none; }
.spark circle { fill: var(--ink); }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
.pill.hit { background: var(--ok-bg); border-color: transparent; color: var(--fall); font-weight: 500; }
.pill.near { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.note { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.pending { color: var(--ink-3); font-size: 13px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--ink); font-family: var(--f-display); font-size: 17px; }

/* 编辑区 */
.edit { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; margin-top: 8px; padding: 12px; border-radius: var(--r); background: var(--paper); border: 1px dashed var(--line); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-2); letter-spacing: 0.04em; }
.field input, .field select, .field textarea { width: 100%; min-height: 36px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.field textarea { min-height: 60px; resize: vertical; }
.field.wide { grid-column: 1 / -1; }
.row-tools { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.inline { display: flex; gap: 6px; }
.inline > * { min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.panel .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.adds { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { margin: 0; font-size: 13px; color: var(--ink-2); }

/* 底部发布栏 */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.dock-in { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.dock-state { font-size: 13px; color: var(--ink-2); min-width: 0; }
.dock-state b { color: var(--ink); font-weight: 500; }
.dock-btns { display: flex; gap: 6px; flex-wrap: wrap; }

footer.foot { font-size: 12px; color: var(--ink-3); display: grid; gap: 4px; }
footer.foot p { margin: 0; }

/* 弹窗 */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 16, 26, 0.45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(520px, 100%); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); color: var(--ink); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; }
.modal h2 { margin: 0; font-family: var(--f-display); font-size: 20px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.err { margin: 0; color: var(--rise); font-size: 13px; min-height: 1em; }
.changes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 50vh; overflow: auto; }
.changes li { padding: 8px 10px; border-radius: 8px; background: var(--paper); font-size: 14px; border-left: 3px solid var(--line); overflow-wrap: anywhere; }
.changes li.add { border-left-color: var(--fall); }
.changes li.remove { border-left-color: var(--rise); }
.changes li.edit, .changes li.site { border-left-color: var(--accent); }
.conflict { display: grid; gap: 6px; padding: 10px; border-radius: 8px; background: var(--paper); }
.conflict .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.conflict label { display: flex; gap: 6px; align-items: flex-start; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
.picker { display: grid; gap: 4px; max-height: 300px; overflow: auto; }
.picker button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent; background: transparent; padding: 6px 8px; border-radius: 8px; }
.picker button:hover, .picker button:focus-visible { background: var(--paper); border-color: var(--line); }
.picker button[disabled] { opacity: 0.45; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (max-width: 520px) {
  .row { grid-template-columns: minmax(0, 1fr); }
    .amt input:focus,   .spark { width: 64px; }
}
@media (prefers-reduced-motion: no-preference) {
  .row { transition: background-color 0.2s; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); } }
}

/* 外币 → 人民币 */
.head { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; flex-wrap: wrap; min-width: 0; }
.head b { font-size: clamp(22px, 5vw, 28px); font-weight: 500; letter-spacing: -0.01em; }
.h-unit { color: var(--ink-2); font-size: 14px; }
.ladder { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.step { display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.step b { color: var(--ink); font-weight: 500; }
.foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; min-width: 0; }
.calc { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; font-size: 14px; }
.calc-in { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); overflow: hidden; }
.calc-in:focus-within { border-color: var(--accent); }
.calc-in input { width: 9.5em; border: 0; background: transparent; padding: 6px 8px; font-family: var(--f-num); font-variant-numeric: tabular-nums; outline: none; }
.calc-in input[aria-invalid] { color: var(--rise); }
.calc-unit { padding: 0 10px; color: var(--ink-2); font-size: 13px; border-left: 1px solid var(--line); align-self: stretch; display: grid; place-items: center; background: var(--surface-2); }
.calc-out { color: var(--ink-2); }
.calc-out b { color: var(--ink); font-size: 16px; font-weight: 500; }
.meta { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); min-width: 0; }
.pricebtn { border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.pricebtn:hover, .pricebtn[aria-expanded="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.hint-hover { color: var(--ink-3); letter-spacing: 0; }
@media (hover: none), (max-width: 699px) { .hint-hover { display: none; } }
.sr-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 物价卡片 */
.pop { position: absolute; z-index: 30; width: min(460px, calc(100vw - 32px)); max-height: min(78vh, 640px); overflow: auto; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 6px rgba(19, 38, 58, 0.08), 0 18px 48px rgba(19, 38, 58, 0.18); padding: 16px; }
.pc { display: grid; gap: 12px; font-size: 13px; }
.pc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pc-head strong { font-family: var(--f-display); font-size: 18px; }
.pc-head span { color: var(--ink-3); font-size: 12px; }
.pc-note { margin: 0; color: var(--ink-2); }
.pc-index { display: grid; gap: 8px; padding: 12px; border-radius: 10px; background: var(--paper); }
.pc-big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pc-big b { font-size: 24px; font-weight: 500; }
.pc-cmp { color: var(--ink-2); }
.pc-bars { display: grid; grid-template-columns: auto minmax(0, 1fr) 2.6em minmax(0, 1fr) 2.6em; gap: 5px 8px; align-items: center; }
.pc-bl { color: var(--ink-2); font-size: 12px; }
.pc-bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.pc-bar i { display: block; height: 100%; border-radius: 4px; }
.pc-bar.here i { background: var(--accent); }
.pc-bar.cn i { background: var(--seal); opacity: 0.55; }
.pc-bv { font-size: 12px; text-align: right; }
.pc-bv.cn { color: var(--ink-3); }
.pc-legend { margin: 0; font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.sw.here { background: var(--accent); }
.sw.cn { background: var(--seal); opacity: 0.55; margin-left: 6px; }
.pc-scroll { overflow-x: auto; }
.pc-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.pc-table th, .pc-table td { padding: 5px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
.pc-table th:first-child, .pc-table td:first-child { text-align: left; white-space: normal; }
.pc-table thead th { font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: 0.04em; }
.pc-table .num { font-family: var(--f-num); font-size: 12px; }
.pc-g th { text-align: left; padding-top: 10px; font-size: 12px; color: var(--ink); font-weight: 700; border-bottom-color: transparent; }
.pc-u { display: block; color: var(--ink-3); font-size: 11px; }
.pc-r { font-family: var(--f-num); font-size: 12px; color: var(--ink-2); }
.pricier { color: var(--rise); }
.cheaper { color: var(--fall); }
.pc-r.pricier, .pc-r.cheaper { font-weight: 500; }
.pc-foot { margin: 0; font-size: 12px; color: var(--ink-3); }
.modal .pc { font-size: 14px; }
.pc-table td:first-child { min-width: 7.5em; }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<main class="wrap" id="app">
  <header class="masthead">
    <div class="guilloche" aria-hidden="true"><svg id="guilloche" viewBox="0 0 800 120" preserveAspectRatio="none"></svg></div>
    <div class="brand">
      <div class="seal" aria-hidden="true">¥</div>
      <div>
        <h1 id="siteTitle">人民币汇率台</h1>
        <p id="siteSub">以人民币为基准，实时换算</p>
      </div>
    </div>
    <div class="topline">
      <div class="status" id="status" data-state="none" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">正在读取汇率…</span></div>
      <button class="btn" id="manageBtn" type="button" hidden>管理</button>
    </div>
  </header>

  <div class="banner" id="draftBanner" hidden>
    <span id="draftBannerText">这台设备上有未发布的草稿。</span>
    <button class="btn sm" id="draftBannerBtn" type="button">继续编辑</button>
  </div>

  <section class="board" aria-label="汇率换算">
    <div class="board-head">
      <span>1 外币 = ? 元 · 在任一行输入金额即可换算</span>
      <span class="hint-hover">鼠标放到货币上，查看当地物价</span>
    </div>
    <ul id="list" style="list-style:none;margin:0;padding:0"></ul>
  </section>

  <section class="panel" id="sitePanel" hidden aria-label="网站设置">
    <h2>网站设置</h2>
    <div class="grid">
      <label class="field"><span>网站标题</span><input id="fTitle" maxlength="40"></label>
      <label class="field"><span>副标题</span><input id="fSub" maxlength="80"></label>
    </div>
    <div class="acts">
      <button class="btn" type="button" id="pwBtn">修改管理密码</button>
      <button class="btn" type="button" id="exportBtn">导出 JSON 备份</button>
      <label class="btn" for="importFile">导入 JSON 备份</label>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="hint" id="modeHint"></p>
  </section>

<script>
/* 汇率台核心逻辑：纯函数，无 DOM。浏览器和 Node 测试共用。 */
const FX = (() => {
  const CATALOG = [
    ["USD", "美元"], ["EUR", "欧元"], ["GBP", "英镑"], ["JPY", "日元"], ["HKD", "港币"],
    ["MOP", "澳门元"], ["TWD", "新台币"], ["KRW", "韩元"], ["SGD", "新加坡元"], ["AUD", "澳元"],
    ["NZD", "新西兰元"], ["CAD", "加元"], ["CHF", "瑞士法郎"], ["SEK", "瑞典克朗"], ["NOK", "挪威克朗"],
    ["DKK", "丹麦克朗"], ["ISK", "冰岛克朗"], ["PLN", "波兰兹罗提"], ["CZK", "捷克克朗"], ["HUF", "匈牙利福林"],
    ["RON", "罗马尼亚列伊"], ["BGN", "保加利亚列弗"], ["TRY", "土耳其里拉"], ["RUB", "俄罗斯卢布"], ["UAH", "乌克兰格里夫纳"],
    ["THB", "泰铢"], ["MYR", "马来西亚林吉特"], ["IDR", "印尼盾"], ["PHP", "菲律宾比索"], ["VND", "越南盾"],
    ["KHR", "柬埔寨瑞尔"], ["LAK", "老挝基普"], ["MMK", "缅甸元"], ["INR", "印度卢比"], ["PKR", "巴基斯坦卢比"],
    ["LKR", "斯里兰卡卢比"], ["NPR", "尼泊尔卢比"], ["BDT", "孟加拉塔卡"], ["MVR", "马尔代夫拉菲亚"], ["MNT", "蒙古图格里克"],
    ["KZT", "哈萨克斯坦坚戈"], ["UZS", "乌兹别克斯坦苏姆"], ["AED", "阿联酋迪拉姆"], ["SAR", "沙特里亚尔"], ["QAR", "卡塔尔里亚尔"],
    ["KWD", "科威特第纳尔"], ["BHD", "巴林第纳尔"], ["OMR", "阿曼里亚尔"], ["JOD", "约旦第纳尔"], ["ILS", "以色列新谢克尔"],
    ["EGP", "埃及镑"], ["MAD", "摩洛哥迪拉姆"], ["TND", "突尼斯第纳尔"], ["ZAR", "南非兰特"], ["KES", "肯尼亚先令"],
    ["NGN", "尼日利亚奈拉"], ["TZS", "坦桑尼亚先令"], ["MUR", "毛里求斯卢比"], ["BRL", "巴西雷亚尔"], ["MXN", "墨西哥比索"],
    ["ARS", "阿根廷比索"], ["CLP", "智利比索"], ["COP", "哥伦比亚比索"], ["PEN", "秘鲁索尔"], ["UYU", "乌拉圭比索"],
    ["FJD", "斐济元"], ["XPF", "太平洋法郎"], ["GEL", "格鲁吉亚拉里"], ["AMD", "亚美尼亚德拉姆"], ["AZN", "阿塞拜疆马纳特"],
    ["RSD", "塞尔维亚第纳尔"], ["ALL", "阿尔巴尼亚列克"], ["MKD", "北马其顿第纳尔"], ["BAM", "波黑可兑换马克"], ["XAU", "黄金（盎司）"],
    ["XAG", "白银（盎司）"], ["BTC", "比特币"], ["ETH", "以太坊"], ["USDT", "泰达币 USDT"], ["USDC", "USD Coin"],
    ["SOL", "Solana"], ["BNB", "币安币"], ["XRP", "瑞波币"], ["DOGE", "狗狗币"],
  ];
  const NAMES = Object.fromEntries(CATALOG);
  const CRYPTO = new Set(["BTC", "ETH", "USDT", "USDC", "SOL", "BNB", "XRP", "DOGE"]);
  /* 银行牌价习惯按 100 单位报价的货币 */
  const PER100_DEFAULT = new Set(["JPY", "KRW", "IDR", "VND", "KHR", "LAK", "MMK", "HUF", "CLP", "COP", "UZS", "MNT", "TZS", "NGN", "PKR", "LKR", "NPR", "INR", "RUB", "ISK", "ARS", "KZT"]);
  const SITE_FIELDS = ["title", "subtitle", "defaultAmount", "per100"];
  const ENTRY_FIELDS = ["kind", "code", "label", "note", "mode", "fixed", "spread", "target", "targetDir"];
  const FIELD_LABEL = {
    title: "网站标题", subtitle: "副标题", defaultAmount: "默认金额", per100: "按 100 单位显示汇率",
    kind: "类型", code: "货币代码", label: "名称", note: "备注", mode: "计价方式",
    fixed: "固定汇率", spread: "加点", target: "目标价", targetDir: "目标方向",
  };

  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  const uid = () => "e" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

  function emptyConfig() {
    return { schema: 1, title: "人民币汇率台", subtitle: "以人民币为基准，实时换算", defaultAmount: 1000, per100: false, entries: [] };
  }

  function liveEntry(code, extra = {}) {
    return { id: uid(), kind: "live", code, label: NAMES[code] || code, note: "", target: null, targetDir: "above", ...extra };
  }

  function normalizeEntry(e) {
    if (!e || typeof e !== "object") return null;
    const code = String(e.code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    if (!code) return null;
    const out = {
      id: typeof e.id === "string" && /^[A-Za-z0-9_-]{1,40}$/.test(e.id) ? e.id : uid(),
      kind: e.kind === "custom" ? "custom" : "live",
      code,
      label: String(e.label ?? NAMES[code] ?? code).slice(0, 40),
      note: String(e.note ?? "").slice(0, 200),
      target: num(e.target),
      targetDir: e.targetDir === "below" ? "below" : "above",
    };
    if (out.kind === "custom") {
      out.mode = e.mode === "fixed" ? "fixed" : "spread";
      out.fixed = num(e.fixed);
      out.spread = num(e.spread) ?? 0;
    }
    return out;
  }

  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = typeof v === "number" ? v : Number(String(v).replace(/[,\s，]/g, ""));
    return Number.isFinite(n) ? n : null;
  }

  function normalizeConfig(c) {
    const base = emptyConfig();
    if (!c || typeof c !== "object") return base;
    const ids = new Set();
    const entries = [];
    for (const raw of Array.isArray(c.entries) ? c.entries : []) {
      const e = normalizeEntry(raw);
      if (!e) continue;
      while (ids.has(e.id)) e.id = uid();
      ids.add(e.id);
      entries.push(e);
    }
    const amt = num(c.defaultAmount);
    return {
      schema: 1,
      title: String(c.title ?? base.title).slice(0, 40) || base.title,
      subtitle: String(c.subtitle ?? base.subtitle).slice(0, 80),
      defaultAmount: amt !== null && amt > 0 ? amt : base.defaultAmount,
      per100: !!c.per100,
      entries,
    };
  }

  /* 只取需要比较和保存的内容 */
  function content(c) {
    const n = normalizeConfig(c);
    return { schema: 1, title: n.title, subtitle: n.subtitle, defaultAmount: n.defaultAmount, per100: n.per100, entries: n.entries };
  }

  /* ---------- 汇率计算 ---------- */
  /* rates 为「1 人民币 = x 外币」，返回「1 外币 = ? 人民币」 */
  function cnyPerUnit(rates, code) {
    if (code === "CNY") return 1;
    const r = rates && rates[code];
    return typeof r === "number" && r > 0 ? 1 / r : null;
  }

  function entryCny(entry, rates) {
    if (entry.kind === "custom") {
      if (entry.mode === "fixed") return entry.fixed > 0 ? entry.fixed : null;
      const live = cnyPerUnit(rates, entry.code);
      return live === null ? null : live * (1 + (entry.spread || 0) / 100);
    }
    return cnyPerUnit(rates, entry.code);
  }

  function targetStatus(entry, value) {
    if (entry.target === null || entry.target === undefined || !(entry.target > 0) || value === null) return null;
    const hit = entry.targetDir === "below" ? value <= entry.target : value >= entry.target;
    if (hit) return { state: "hit", text: "已达目标" };
    const gap = Math.abs(value - entry.target) / entry.target;
    if (gap <= 0.01) return { state: "near", text: "接近目标 " + (gap * 100).toFixed(2) + "%" };
    return { state: "watch", text: "距目标 " + (gap * 100).toFixed(1) + "%" };
  }

  /* 历史快照：找最接近 hoursAgo 的一条（容差 ±windowHours） */
  function snapshotNear(history, now, hoursAgo, windowHours = 6) {
    const want = now - hoursAgo * 3600e3;
    let best = null, bestGap = Infinity;
    for (const h of history || []) {
      const t = Date.parse(h.t);
      if (!Number.isFinite(t)) continue;
      const gap = Math.abs(t - want);
      if (gap < bestGap) { best = h; bestGap = gap; }
    }
    return best && bestGap <= windowHours * 3600e3 ? best : null;
  }

  function seriesFor(history, code, now, days = 7) {
    const from = now - days * 86400e3;
    return (history || [])
      .map((h) => ({ t: Date.parse(h.t), v: cnyPerUnit(h.rates, code) }))
      .filter((p) => Number.isFinite(p.t) && p.t >= from && p.v !== null)
      .sort((a, b) => a.t - b.t);
  }

  /* ---------- 数字格式 ---------- */
  function decimalsFor(code, value) {
    if (CRYPTO.has(code) && code !== "USDT" && code !== "USDC") {
      const a = Math.abs(value);
      if (a === 0) return 2;
      if (a < 0.001) return 8;
      if (a < 1) return 6;
      return 4;
    }
    if (["JPY", "KRW", "IDR", "VND", "KHR", "LAK", "MMK", "CLP", "COP", "UZS", "MNT", "TZS", "HUF", "ISK"].includes(code)) return Math.abs(value) < 100 ? 2 : 0;
    return 2;
  }

  function fmtAmount(value, code) {
    if (value === null || !Number.isFinite(value)) return "";
    const d = decimalsFor(code, value);
    return value.toLocaleString("en-US", { minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d });
  }

  function fmtRate(value) {
    if (value === null || !Number.isFinite(value)) return "—";
    const a = Math.abs(value);
    let d = 4;
    if (a >= 10000) d = 2;
    else if (a < 0.0001) d = 8;
    else if (a < 0.01) d = 6;
    return value.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }

  /* 换算阶梯：值钱的货币看 10 / 100 / 1000；越南盾、印尼盾这类按能买到东西的量级放大 */
  function ladderFor(cnyPerUnit) {
    if (!(cnyPerUnit > 0)) return [];
    if (cnyPerUnit >= 0.05) return [10, 100, 1000];
    const s0 = Math.pow(10, Math.ceil(Math.log10(0.1 / cnyPerUnit)));
    return [s0 * 10, s0 * 100, s0 * 1000];
  }

  /* 人民币金额：1 元以上两位小数；不足 1 元保留 4 位有效数字 */
  function fmtCny(value) {
    if (value === null || !Number.isFinite(value)) return "—";
    const a = Math.abs(value);
    if (a >= 1) return value.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (a === 0) return "0";
    const d = Math.min(10, Math.max(2, 3 - Math.floor(Math.log10(a))));
    return value.toFixed(d).replace(/0+$/, "").replace(/\.$/, "");
  }

  function fmtInt(n) { return n.toLocaleString("en-US"); }

  /* 商品价格对比：当地价折人民币后与中国价相比的倍数 */
  function priceRatio(localPrice, cnyPerUnitRate, chinaPrice) {
    if (!(localPrice > 0) || !(cnyPerUnitRate > 0) || !(chinaPrice > 0)) return null;
    return (localPrice * cnyPerUnitRate) / chinaPrice;
  }

  function parseAmount(text) {
    const s = String(text ?? "").replace(/[,\s，]/g, "").replace(/。/g, ".");
    if (s === "" || s === ".") return null;
    if (!/^-?\d*\.?\d*(e[+-]?\d+)?$/i.test(s)) return NaN;
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }

  function fmtAgo(iso, now) {
    const t = Date.parse(iso);
    if (!Number.isFinite(t)) return "未知";
    const s = Math.max(0, Math.round((now - t) / 1000));
    if (s < 60) return "刚刚";
    const m = Math.round(s / 60);
    if (m < 60) return m + " 分钟前";
    const h = Math.round(m / 60);
    if (h < 48) return h + " 小时前";
    return Math.round(h / 24) + " 天前";
  }

  function freshness(iso, now) {
    const t = Date.parse(iso);
    if (!Number.isFinite(t)) return "none";
    const min = (now - t) / 60000;
    if (min <= 80) return "fresh";
    if (min <= 240) return "late";
    return "stale";
  }

  /* ---------- 修改清单 ---------- */
  function entryName(e) {
    return (e.label || e.code) + (e.label && e.label !== e.code ? " " + e.code : "");
  }

  function showVal(field, v) {
    if (v === null || v === undefined || v === "") return "（空）";
    if (field === "per100") return v ? "开" : "关";
    if (field === "kind") return v === "custom" ? "自定义" : "实时";
    if (field === "mode") return v === "fixed" ? "固定汇率" : "实时加点";
    if (field === "targetDir") return v === "below" ? "低于" : "高于";
    if (field === "spread") return v + "%";
    return String(v);
  }

  function diff(before, after) {
    const a = content(before), b = content(after);
    const out = [];
    for (const f of SITE_FIELDS) {
      if (!same(a[f], b[f])) out.push({ type: "site", text: FIELD_LABEL[f] + "：" + showVal(f, a[f]) + " → " + showVal(f, b[f]) });
    }
    const am = new Map(a.entries.map((e) => [e.id, e]));
    const bm = new Map(b.entries.map((e) => [e.id, e]));
    for (const e of b.entries) {
      const old = am.get(e.id);
      if (!old) { out.push({ type: "add", text: "新增 " + entryName(e) + (e.kind === "custom" ? "（自定义）" : "") }); continue; }
      for (const f of ENTRY_FIELDS) {
        if (!same(old[f], e[f])) out.push({ type: "edit", text: entryName(e) + " · " + FIELD_LABEL[f] + "：" + showVal(f, old[f]) + " → " + showVal(f, e[f]) });
      }
    }
    for (const e of a.entries) if (!bm.has(e.id)) out.push({ type: "remove", text: "删除 " + entryName(e) });
    const ao = a.entries.filter((e) => bm.has(e.id)).map((e) => e.id);
    const bo = b.entries.filter((e) => am.has(e.id)).map((e) => e.id);
    if (!same(ao, bo)) out.push({ type: "order", text: "调整了货币顺序" });
    return out;
  }

  /* ---------- 三方合并（字段级） ---------- */
  function merge3(baseIn, localIn, remoteIn) {
    const base = content(baseIn), local = content(localIn), remote = content(remoteIn);
    const merged = { schema: 1 };
    const conflicts = [];
    const pick = (path, label, b, l, r, set) => {
      if (same(l, r)) return set(clone(l));
      if (same(l, b)) return set(clone(r));
      if (same(r, b)) return set(clone(l));
      set(clone(l));
      conflicts.push({ path, label, local: clone(l), remote: clone(r), field: path[path.length - 1] });
    };
    for (const f of SITE_FIELDS) pick([f], FIELD_LABEL[f], base[f], local[f], remote[f], (v) => (merged[f] = v));

    const bm = new Map(base.entries.map((e) => [e.id, e]));
    const lm = new Map(local.entries.map((e) => [e.id, e]));
    const rm = new Map(remote.entries.map((e) => [e.id, e]));
    const result = new Map();
    const ids = new Set([...bm.keys(), ...lm.keys(), ...rm.keys()]);
    for (const id of ids) {
      const b = bm.get(id), l = lm.get(id), r = rm.get(id);
      if (!b) { result.set(id, clone(l || r)); continue; } /* 新增：两边 id 不会重复 */
      if (!l && !r) continue;
      if (!l || !r) {
        const kept = l || r;
        if (same(kept, b)) continue; /* 一边删除，另一边没改 → 删除 */
        if (l) result.set(id, clone(l)); /* 默认保留本机的状态，冲突里可改选云端 */
        conflicts.push({ path: ["entries", id, "__exists"], label: entryName(kept) + " · " + (l ? "云端已删除，本机做了修改" : "本机已删除，云端做了修改"), local: !!l, remote: !!r, field: "__exists", entry: clone(kept) });
        continue;
      }
      const e = { id };
      for (const f of ["id", ...ENTRY_FIELDS, ...Object.keys(l), ...Object.keys(r)]) {
        if (f === "id" || f in e) continue;
        pick(["entries", id, f], entryName(l) + " · " + (FIELD_LABEL[f] || f), b[f], l[f], r[f], (v) => { if (v !== undefined) e[f] = v; });
      }
      result.set(id, e);
    }
    /* 顺序：本机改了顺序则以本机为准，否则跟随云端；再补上另一边新增的 */
    const order = (list) => list.map((e) => e.id);
    const localReordered = !same(order(base.entries).filter((id) => lm.has(id)), order(local.entries).filter((id) => bm.has(id)));
    const primary = localReordered ? order(local.entries) : order(remote.entries);
    const secondary = localReordered ? order(remote.entries) : order(local.entries);
    const seq = [];
    for (const id of [...primary, ...secondary, ...order(base.entries)]) if (result.has(id) && !seq.includes(id)) seq.push(id);
    merged.entries = seq.map((id) => result.get(id));
    return { merged: content(merged), conflicts };
  }

  /* 按用户选择解决冲突：choice[i] = "local" | "remote" */
  function resolve(mergedIn, conflicts, choices) {
    const m = clone(mergedIn);
    conflicts.forEach((c, i) => {
      if (choices[i] !== "remote") return;
      if (c.path.length === 1) { m[c.path[0]] = clone(c.remote); return; }
      const [, id, field] = c.path;
      const idx = m.entries.findIndex((e) => e.id === id);
      if (field === "__exists") {
        if (!c.remote && idx >= 0) m.entries.splice(idx, 1);
        if (c.remote && idx < 0) m.entries.push(clone(c.entry));
        return;
      }
      if (idx >= 0) {
        if (c.remote === undefined) delete m.entries[idx][field];
        else m.entries[idx][field] = clone(c.remote);
      }
    });
    return content(m);
  }

  /* ---------- 密码 ---------- */
  const b64 = (bytes) => btoa(String.fromCharCode(...bytes));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function derive(password, saltB64, iterations) {
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unb64(saltB64), iterations }, key, 256);
    return b64(new Uint8Array(bits));
  }
  async function makeLock(password) {
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    const iterations = 210000;
    return { v: 1, kdf: "PBKDF2-SHA256", iterations, salt, hash: await derive(password, salt, iterations), setAt: new Date().toISOString() };
  }
  async function checkLock(lock, password) {
    if (!lock || !lock.salt || !lock.hash || !(lock.iterations >= 100000)) return false;
    const h = await derive(password, lock.salt, lock.iterations);
    if (h.length !== lock.hash.length) return false;
    let d = 0;
    for (let i = 0; i < h.length; i++) d |= h.charCodeAt(i) ^ lock.hash.charCodeAt(i);
    return d === 0;
  }

  return {
    CATALOG, NAMES, CRYPTO, PER100_DEFAULT, FIELD_LABEL, clone, same, uid, num,
    emptyConfig, liveEntry, normalizeConfig, normalizeEntry, content,
    cnyPerUnit, entryCny, targetStatus, snapshotNear, seriesFor,
    fmtAmount, fmtRate, parseAmount, fmtAgo, freshness, ladderFor, fmtCny, fmtInt, priceRatio,
    diff, merge3, resolve, makeLock, checkLock, entryName,
  };
})();
if (typeof module !== "undefined") module.exports = FX;

</script>
<script>
/* 各国物价参考数据（Numbeo，2026 年 10 月抓取）。
   prices 为当地货币；index 为 Numbeo 指数（纽约 = 100）。
   更新方法：改这里的数字和 updated 日期，然后 node build.mjs。 */
const PRICES = {
  source: "Numbeo",

<script>
/* GitHub Pages 版：密码保管库 + 仓库读写。
   GitHub 令牌在浏览器里用管理密码加密（PBKDF2 60 万次 → AES-256-GCM），
   仓库里只保存加密结果 data/vault.json。和科研日志同一套方案。 */
const GH = (() => {
  const ITERATIONS = 600000;
  const TOKEN_PATTERN = /^github_pat_[A-Za-z0-9_]{20,}$/;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const toB64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s); };
  const fromB64 = (t) => Uint8Array.from(atob(t.replace(/\s/g, "")), (c) => c.charCodeAt(0));
  const aad = (repo) => enc.encode("exchange-rates/vault/v1/" + repo.toLowerCase());
  const utf8ToB64 = (text) => toB64(enc.encode(text));
  const b64ToUtf8 = (b64) => dec.decode(fromB64(b64));

  const validToken = (t) => typeof t === "string" && TOKEN_PATTERN.test(t.trim());
  function passwordProblem(pw) {
    if (typeof pw !== "string" || pw.length < 8) return "密码至少需要 8 位。";
    if (pw.length > 200) return "密码太长了。";
    if (/^\d+$/.test(pw)) return "不要只用数字，加几个字母吧。";
    if (new Set(pw).size < 5) return "密码里重复的字符太多了。";
    if (["password", "12345678", "qwertyui", "iloveyou", "abcdefgh"].some((w) => pw.toLowerCase().includes(w))) return "这个密码太常见了，换一个吧。";
    return "";
  }
  async function deriveKey(pw, salt, iterations, usage) {
    const material = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations }, material, { name: "AES-GCM", length: 256 }, false, [usage]);
  }
  async function seal(token, pw, repo) {
    const problem = passwordProblem(pw);
    if (problem) throw Error(problem);
    if (!validToken(token)) throw Error("令牌格式不对：请使用 github_pat_ 开头的细粒度令牌。");
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pw, salt, ITERATIONS, "encrypt");
    const plain = enc.encode(JSON.stringify({ token: token.trim(), repo }));
    try {
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: aad(repo), tagLength: 128 }, key, plain);
      return { version: 1, repo, algorithm: "AES-256-GCM", kdf: "PBKDF2-SHA256", iterations: ITERATIONS, salt: toB64(salt), iv: toB64(iv), ciphertext: toB64(new Uint8Array(ct)), updatedAt: new Date().toISOString() };
    } finally { plain.fill(0); }
  }
  const validVault = (v) => !!v && v.version === 1 && v.algorithm === "AES-256-GCM" && v.kdf === "PBKDF2-SHA256" && Number.isInteger(v.iterations) && v.iterations >= ITERATIONS && v.iterations <= 3000000 && typeof v.salt === "string" && typeof v.iv === "string" && typeof v.ciphertext === "string" && v.ciphertext.length < 10000;
  async function open(vault, pw, repo) {
    if (!validVault(vault)) throw Error("授权文件已损坏，请重新设置。");
    let bytes;
    try {
      const key = await deriveKey(pw, fromB64(vault.salt), vault.iterations, "decrypt");
      bytes = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(vault.iv), additionalData: aad(repo), tagLength: 128 }, key, fromB64(vault.ciphertext)));
      const payload = JSON.parse(dec.decode(bytes));
      if (!validToken(payload.token)) throw Error();
      return payload.token;
    } catch { throw Error("密码不正确。"); }
    finally { bytes && bytes.fill(0); }
  }

  const MESSAGES = {
    401: "GitHub 令牌已失效或被撤销，请在网站设置里更换令牌。",
    403: "GitHub 拒绝了请求：请确认令牌对这个仓库有 Contents 读写权限，或稍后再试。",
    404: "找不到仓库或文件，请确认令牌授权了这个仓库。",
    409: "另一台设备刚保存过，需要重新合并。",
    422: "GitHub 没有接受这次保存，可能另一台设备刚保存过。",
  };
  class Err extends Error { constructor(m, status) { super(m); this.status = status; } }

  class Client {
    #token = "";
    constructor(repo, branch = "main", fetcher = globalThis.fetch, apiBase = "https://api.github.com") {
      this.repo = repo; this.branch = branch; this.apiBase = apiBase; this.fetch = fetcher.bind(globalThis);
    }
    get unlocked() { return !!this.#token; }
    setToken(t) { this.#token = t || ""; }
    async api(path, { method = "GET", body, auth = true } = {}) {
      const headers = { Accept: "application/vnd.github+json" };
      if (auth && this.#token) { headers.Authorization = "Bearer " + this.#token; headers["X-GitHub-Api-Version"] = "2022-11-28"; }
      if (body) headers["Content-Type"] = "application/json";
      let res;
      try {
        res = await this.fetch(this.apiBase + path, { method, headers, cache: "no-store", signal: AbortSignal.timeout(30000), ...(body ? { body: JSON.stringify(body) } : {}) });
      } catch (e) {
        throw new Err(e && e.name === "TimeoutError" ? "连接 GitHub 超时，草稿仍保存在本机。" : "无法连接 GitHub，草稿仍保存在本机。", 0);
      }
      if (res.status === 204) return null;
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Err(MESSAGES[res.status] || "GitHub 请求失败（" + res.status + "）。", res.status);
      return data;
    }
    contentsPath(path) { return "/repos/" + this.repo + "/contents/" + path.split("/").map(encodeURIComponent).join("/"); }
    async checkAccess() {
      const info = await this.api("/repos/" + this.repo);
      if (!info || !info.permissions || !info.permissions.push) throw new Err("这个令牌没有写入权限，请确认 Contents 选了 Read and write。", 403);
      return info;
    }
    /* 返回 { data, sha }；文件不存在返回 null */
    async readJSON(path, { auth = true } = {}) {
      try {
        const f = await this.api(this.contentsPath(path) + "?ref=" + encodeURIComponent(this.branch), { auth });
        if (!f || Array.isArray(f) || f.type !== "file") return null;
        return { data: JSON.parse(b64ToUtf8(f.content || "")), sha: f.sha };
      } catch (e) { if (e.status === 404) return null; throw e; }
    }
    /* 带 sha 写入：别的设备先保存了会得到 409/422 */
    async writeJSON(path, data, sha, message) {
      const res = await this.api(this.contentsPath(path), {
        method: "PUT",
        body: { message, branch: this.branch, content: utf8ToB64(JSON.stringify(data, null, 2) + "\n"), ...(sha ? { sha } : {}) },
      });
      return { sha: res.content.sha, commit: res.commit.sha };
    }
  }
  return { Client, Err, seal, open, validToken, validVault, passwordProblem };
})();
if (typeof module !== "undefined") module.exports = GH;

</script>

(() => {

      <div class="head" data-t="head"></div>

        <div class="meta"><span data-t="chg"></span><span data-t="spark"></span><span data-t="pill"></span>${priceCountry(e.code) ? `<button type="button" class="pricebtn" data-price="${id}" aria-expanded="false">${esc(priceCountry(e.code).name)}物价</button>` : ""}</div>

      html += `<div class="edit">
        <label class="field"><span>名称</span><input data-f="label" maxlength="40" value="${esc(e.label)}"></label>
        ${e.kind === "custom" ? `<label class="field"><span>货币代码</span><input data-f="code" maxlength="8" value="${esc(e.code)}"></label>
        <label class="field"><span>计价方式</span><select data-f="mode">${opt("spread", e.mode, "实时汇率加点")}${opt("fixed", e.mode, "固定汇率")}</select></label>

        <label class="field"><span>目标价：1 ${esc(e.code)} = ? 人民币</span><span class="inline"><select data-f="targetDir" aria-label="目标方向">${opt("below", e.targetDir, "低于")}${opt("above", e.targetDir, "高于")}</select><input data-f="target" inputmode="decimal" placeholder="不设" value="${e.target ?? ""}" aria-label="目标价"></span></label>

  function sparkSvg(points, days = 7) {
    if (points.length < 2) return "";
    const w = 84, h = 22, pad = 2;
    const t0 = points[0].t, t1 = points[points.length - 1].t;
    let lo = Infinity, hi = -Infinity;
    for (const p of points) { lo = Math.min(lo, p.v); hi = Math.max(hi, p.v); }
    if (hi === lo) { hi += lo * 1e-6 || 1; lo -= lo * 1e-6 || 1; }
    const x = (t) => pad + ((t - t0) / (t1 - t0 || 1)) * (w - pad * 2);
    const y = (v) => pad + (1 - (v - lo) / (hi - lo)) * (h - pad * 2);
    const line = points.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join("");
    const last = points[points.length - 1];
    const area = line + `L${x(last.t).toFixed(1)} ${h}L${x(t0).toFixed(1)} ${h}Z`;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="近 ${days} 天走势"><title>近 ${days} 天走势</title><path class="a" d="${area}"/><path class="l" d="${line}"/><circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="2"/></svg>`;
  }

  function updateNumbers() {
    const c = view();
    const rates = S.rates && S.rates.rates;
    const now = Date.now();
    const active = document.activeElement;
    /* 每日数据（欧洲央行）取至少 12 小时前的最近一条；逐小时数据取约 24 小时前 */
    const past = S.daily
      ? S.history.filter((h) => Date.parse(h.t) <= now - 12 * 3600e3).sort((a, b) => Date.parse(b.t) - Date.parse(a.t))[0] || null
      : FX.snapshotNear(S.history, now, 24);
    const chgTitle = S.daily && past ? "与 " + past.t.slice(0, 10) + " 欧洲央行参考价相比" : "与约 24 小时前相比";
    const sparkDays = S.daily ? 30 : 7;
    for (const e of c.entries) {
      const li = document.querySelector(`li[data-id="${CSS.escape(e.id)}"]`);
      if (!li) continue;
      const val = FX.entryCny(e, rates);
      const unit = unitName(e.code);
      const input = li.querySelector("input[data-amt]");
      input.disabled = !val;
      updateCalc(li, e, val);
      li.querySelector('[data-t="label"]').textContent = e.label;
      li.querySelector('[data-t="tag"]').textContent = tagText(e);
      const note = li.querySelector('[data-t="note"]');
      note.textContent = e.note; note.hidden = !e.note;
      const headEl = li.querySelector('[data-t="head"]');
      const ladderEl = li.querySelector('[data-t="ladder"]');
      if (val) {
        headEl.innerHTML = `<span class="h-unit">1 ${esc(unit)} =</span> <b class="num">${esc(FX.fmtRate(val))}</b> <span class="h-unit">元</span>`;
        ladderEl.innerHTML = FX.ladderFor(val).map((n) => `<span class="step"><span class="num">${FX.fmtInt(n)}</span> ${esc(unit)} = <b class="num">${esc(FX.fmtCny(n * val))}</b> 元</span>`).join("");
      } else {
        headEl.innerHTML = `<span class="pending">${S.rates ? (e.kind === "custom" && e.mode === "fixed" ? "请填写固定汇率" : `暂无 ${esc(e.code)} 汇率`) : "等待汇率"}</span>`;
        ladderEl.innerHTML = "";
      }
      const fixed = e.kind === "custom" && e.mode === "fixed";
      const liveNow = FX.cnyPerUnit(rates, e.code);
      const then = past ? FX.cnyPerUnit(past.rates, e.code) : null;
      const chgEl = li.querySelector('[data-t="chg"]');
      if (!fixed && liveNow && then) {
        const ch = (liveNow / then - 1) * 100;
        const cls = Math.abs(ch) < 0.005 ? "flat" : ch > 0 ? "up" : "down";
        chgEl.innerHTML = `<span class="chg ${cls}" title="${esc(chgTitle)}">${ch > 0 ? "+" : ""}${ch.toFixed(2)}%</span>`;
      } else chgEl.innerHTML = "";
      let series = fixed ? [] : FX.seriesFor(S.history, e.code, now, sparkDays);
      if (S.daily && series.length && liveNow) series = [...series, { t: now, v: liveNow }];
      li.querySelector('[data-t="spark"]').innerHTML = fixed ? "" : sparkSvg(series, sparkDays);
      const st = FX.targetStatus(e, val);
      const tgt = st ? ` · 目标 ${e.targetDir === "below" ? "≤" : "≥"} ${FX.fmtRate(e.target)}` : "";
      li.querySelector('[data-t="pill"]').innerHTML = st ? `<span class="pill ${st.state}" title="目标${e.targetDir === "below" ? "低于" : "高于"} ${esc(FX.fmtRate(e.target))} 元">${esc(st.text)}${esc(tgt)}</span>` : "";
    }
    if (S.popFor && !$("pricePop").hidden) $("pricePop").innerHTML = priceCardHtml(S.popFor.code);
  }

  function renderStatus() {
    const el = $("status"), text = $("statusText");
    const r = S.rates;
    const now = Date.now();
    if (S.mode === "loading") { el.dataset.state = "none"; text.textContent = "正在连接…"; return; }
    if (S.mode === "offline") { el.dataset.state = "stale"; text.textContent = "需要登录 claude.ai 才能读取汇率"; return; }
    if (!r || !r.fetchedAt) {
      el.dataset.state = S.rateError ? "stale" : "none";
      text.textContent = S.rateError || "等待第一次汇率更新";
      return;
    }
    const f = FX.freshness(r.fetchedAt, now);
    el.dataset.state = f;
    const label = S.mode === "standalone" || S.mode === "pages" ? (S.rateError ? "接口暂时不可用" : "实时 · 每分钟刷新") : { fresh: "汇率正常", late: "更新延迟", stale: "汇率可能已过期", none: "" }[f];
    const when = new Date(r.fetchedAt);
    const hhmm = when.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    text.innerHTML = `<b>${esc(label)}</b> · 更新于 ${esc(FX.fmtAgo(r.fetchedAt, now))}（${esc(hhmm)}）· ${esc(r.source || "")}`;
    text.title = r.fetchedAt;
  }

  function renderSitePanel() {
    const p = $("sitePanel");
    p.hidden = !S.editing;
    if (!S.editing) return;
    const c = S.draft;
    const set = (id, v) => { const el = $(id); if (document.activeElement !== el) el.value = v; };
    set("fTitle", c.title); set("fSub", c.subtitle);
    $("pwBtn").hidden = !shared();
    $("pwBtn").textContent = S.mode === "pages" ? "修改密码 / 更换令牌" : "修改管理密码";
    $("modeHint").textContent = S.mode === "cloud"
      ? "发布后，所有打开这个页面的设备都会自动换成新版本。汇率由后台自动写入，页面打开着也会自己刷新。"
      : S.mode === "pages"
        ? "发布会在 GitHub 仓库里保存一次提交（data/config.json），其他设备打开页面就能看到，误改也能从提交历史找回。"
        : "单机模式：修改只保存在这台设备的浏览器里，汇率直接从接口每分钟刷新一次。";
  }

  function renderDock() {
    $("dock").hidden = !S.editing;
    if (!S.editing) return;
    const n = FX.diff(S.baseline.doc, S.draft).length;
    const remoteMoved = shared() && S.published && S.published.revision && S.published.revision !== S.baseline.revision;
    $("dockState").innerHTML = n ? `<b>${n} 处修改</b> 未发布 · 草稿已保存在本机${remoteMoved ? " · 云端有新版本，发布时自动合并" : ""}` : `没有未发布的修改${remoteMoved ? " · 云端有新版本" : ""}`;
    $("undoBtn").disabled = !S.undo.length;
    $("redoBtn").disabled = !S.redo.length;
    $("publishBtn").disabled = !n || S.busy;
    $("publishBtn").textContent = shared() ? "发布修改" : "保存修改";
    $("syncBtn").hidden = !shared();
    $("lockBtn").textContent = shared() ? "锁定" : "退出编辑";
  }

  function renderBanner() {
    const b = $("draftBanner");
    const saved = store.get(LS_DRAFT);
    const can = S.mode === "standalone" || S.mode === "pages" || S.canEdit;
    if (S.editing || !saved || !saved.draft || !can) { b.hidden = true; return; }
    const n = FX.diff(saved.baseline?.doc || FX.emptyConfig(), saved.draft).length;
    b.hidden = !n;
    $("draftBannerText").textContent = `这台设备上有 ${n} 处未发布的修改。`;
  }

  /* ---------- 金额输入 ---------- */
  /* ---------- 物价卡片 ---------- */
  function priceCardHtml(code) {
    const c = priceCountry(code);
    if (!c) return "";
    const cn = PRICES.countries[PRICES.baseline];
    const rate = FX.cnyPerUnit(S.rates && S.rates.rates, code);
    const col = c.index.col / cn.index.col;
    const times = (r) => (r >= 1 ? `约为中国的 ${r.toFixed(r >= 10 ? 0 : 1)} 倍` : `约为中国的 ${Math.round(r * 100)}%`);
    const bars = [["生活成本", "col"], ["超市", "groceries"], ["餐厅", "restaurant"], ["房租", "rent"]];
    const max = Math.max(...bars.flatMap(([, k]) => [c.index[k], cn.index[k]])) * 1.08;
    const bar = (v, cls) => `<span class="pc-bar ${cls}"><i style="width:${((v / max) * 100).toFixed(1)}%"></i></span>`;
    const ratioCell = (key, local, china) => {
      const r = FX.priceRatio(local, rate, china);
      if (r === null) return `<td class="pc-r">—</td>`;
      const cls = key === "salary" ? "" : r > 1.15 ? "pricier" : r < 0.87 ? "cheaper" : "";
      return `<td class="pc-r ${cls}">×${r.toFixed(r >= 10 ? 0 : r >= 1 ? 1 : 2)}</td>`;
    };
    return `<div class="pc">
      <div class="pc-head"><strong>${esc(c.name)}物价</strong><span>Numbeo · ${esc(c.updated)}</span></div>
      ${c.note ? `<p class="pc-note">${esc(c.note)}</p>` : ""}
      <div class="pc-index">
        <div class="pc-big"><span>生活成本指数</span><b class="num">${c.index.col.toFixed(1)}</b><span class="pc-cmp">中国 ${cn.index.col.toFixed(1)} · ${times(col)}</span></div>
        <div class="pc-bars">${bars.map(([label, k]) => `<span class="pc-bl">${label}</span>${bar(c.index[k], "here")}<span class="pc-bv num">${c.index[k].toFixed(1)}</span>${bar(cn.index[k], "cn")}<span class="pc-bv cn num">${cn.index[k].toFixed(1)}</span>`).join("")}</div>
        <p class="pc-legend"><span class="sw here"></span>${esc(c.name)} <span class="sw cn"></span>中国 · 指数以纽约 = 100，${esc(c.indexPeriod)}</p>
      </div>
      <div class="pc-scroll"><table class="pc-table">
        <thead><tr><th>商品</th><th>当地（${esc(c.currency)}）</th><th>≈ 人民币</th><th>中国的几倍</th></tr></thead>
        ${PRICES.groups.map((g) => `<tbody><tr class="pc-g"><th colspan="4">${esc(g.name)}</th></tr>${g.items.map(([k, label, unit]) => {
          const local = c.prices[k], china = cn.prices[k];
          return `<tr><td>${esc(label)}${unit ? `<span class="pc-u">${esc(unit)}</span>` : ""}</td><td class="num">${esc(FX.fmtAmount(local, code))}</td><td class="num">${rate ? "¥" + esc(FX.fmtCny(local * rate)) : "—"}</td>${ratioCell(k, local, china)}</tr>`;
        }).join("")}</tbody>`).join("")}
      </table></div>
      <p class="pc-foot">价格为全国平均，大城市通常更高；人民币折算按当前实时汇率。<span class="pricier">红</span>表示比中国贵，<span class="cheaper">绿</span>表示比中国便宜。</p>
    </div>`;
  }

  const pop = () => $("pricePop");
  const finePointer = () => matchMedia("(hover: hover) and (pointer: fine)").matches && innerWidth >= 700;
  let popTimer = 0, hideTimer = 0;
  function showPop(li, viaButton) {
    const e = view().entries.find((x) => x.id === li.dataset.id);
    if (!e || !priceCountry(e.code)) return;
    clearTimeout(hideTimer);
    if (!finePointer()) { openModal(`<h2 id="modalTitle" class="sr-title">${esc(priceCountry(e.code).name)}物价</h2>${priceCardHtml(e.code)}<div class="acts"><button class="btn" type="button" data-close>关闭</button></div>`); return; }
    const p = pop();
    S.popFor = { id: e.id, code: e.code };
    p.innerHTML = priceCardHtml(e.code);
    p.hidden = false;
    const r = li.getBoundingClientRect();
    const w = p.offsetWidth, h = p.offsetHeight;
    let left = Math.min(r.right - w - 8, innerWidth - w - 16);
    left = Math.max(16, left);
    let top = r.top + scrollY + 52;
    if (r.top + 52 + h > innerHeight - 12 && r.top - h - 8 > 0) top = r.top + scrollY - h + 8; /* 下面放不下就放到上面 */
    p.style.left = left + scrollX + "px";
    p.style.top = top + "px";
    document.querySelectorAll(".pricebtn[aria-expanded=true]").forEach((b) => b.setAttribute("aria-expanded", "false"));
    li.querySelector(".pricebtn")?.setAttribute("aria-expanded", "true");
    if (viaButton) p.dataset.pinned = "1"; else delete p.dataset.pinned;
  }
  function hidePop(force) {
    const p = pop();
    if (!force && p.dataset.pinned) return;
    p.hidden = true; delete p.dataset.pinned; S.popFor = null;
    document.querySelectorAll(".pricebtn[aria-expanded=true]").forEach((b) => b.setAttribute("aria-expanded", "false"));
  }
  $("list").addEventListener("mouseover", (ev) => {
    if (S.editing || !finePointer()) return;
    const li = ev.target.closest("li[data-id]");
    if (!li || (S.popFor && S.popFor.id === li.dataset.id)) { clearTimeout(hideTimer); return; }
    clearTimeout(popTimer);
    popTimer = setTimeout(() => showPop(li, false), 220);
  });
  $("list").addEventListener("mouseout", (ev) => {
    const li = ev.target.closest("li[data-id]");
    if (!li || li.contains(ev.relatedTarget) || pop().contains(ev.relatedTarget)) return;
    clearTimeout(popTimer);
    hideTimer = setTimeout(() => hidePop(false), 180);
  });
  document.addEventListener("mouseover", (ev) => { if (pop().contains(ev.target)) clearTimeout(hideTimer); });
  $("pricePop").addEventListener("mouseleave", (ev) => {
    if (ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest(`li[data-id]`)) return;
    hideTimer = setTimeout(() => hidePop(false), 180);
  });
  $("list").addEventListener("click", (ev) => {
    const b = ev.target.closest("button.pricebtn");
    if (!b) return;
    const li = b.closest("li[data-id]");
    if (!pop().hidden && S.popFor && S.popFor.id === li.dataset.id && pop().dataset.pinned) return hidePop(true);
    showPop(li, true);
  });
  document.addEventListener("click", (ev) => {
    if (pop().hidden || pop().contains(ev.target) || ev.target.closest("button.pricebtn")) return;
    hidePop(true);
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !pop().hidden) hidePop(true); });
  window.addEventListener("resize", () => hidePop(true));

  function updateCalc(li, e, val) {
    const input = li.querySelector("input[data-amt]");
    const out = li.querySelector('[data-t="out"]');
    const v = FX.parseAmount(input.value);
    input.toggleAttribute("aria-invalid", Number.isNaN(v));
    out.innerHTML = val && v !== null && !Number.isNaN(v) ? `= <b class="num">${esc(FX.fmtCny(v * val))}</b> 元` : "= — 元";
  }
  $("list").addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.dataset.amt) {
      const e = view().entries.find((x) => x.id === t.dataset.amt);
      S.amounts[t.dataset.amt] = t.value;
      if (e) updateCalc(t.closest("li"), e, FX.entryCny(e, S.rates && S.rates.rates));
      return;
    }
    if (t.dataset.f && S.editing) editField(t, false);
  });

  /* ---------- 编辑 ---------- */
  const NUM_FIELDS = new Set(["fixed", "spread", "target"]);
  function editField(t, structural) {
    const li = t.closest("li[data-id]");
    const e = S.draft.entries.find((x) => x.id === li.dataset.id);
    if (!e) return;
    const f = t.dataset.f;
    let v = t.value;
    if (NUM_FIELDS.has(f)) { v = FX.num(v); if (f === "spread" && v === null) v = 0; }
    if (f === "code") v = String(v).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || e.code;
    e[f] = v;
    saveDraft();
    if (structural) { pushUndoFrom(S.fieldBefore); S.fieldBefore = null; render(); }
    else { updateNumbers(); renderDock(); }
  }
  $("list").addEventListener("change", (ev) => {
    const t = ev.target;
    if (!t.dataset.f || !S.editing) return;
    if (t.tagName === "SELECT") editField(t, true);
    else { editField(t, false); pushUndoFrom(S.fieldBefore); S.fieldBefore = JSON.stringify(S.draft); renderDock(); }
  });
  document.addEventListener("focusin", (ev) => {
    const t = ev.target;
    if (S.editing && (t.dataset?.f || t.closest?.("#sitePanel"))) S.fieldBefore = JSON.stringify(S.draft);
  });
  function pushUndoFrom(before) {
    if (!before || before === JSON.stringify(S.draft)) return;
    S.undo.push(before); if (S.undo.length > 100) S.undo.shift();
    S.redo = [];
    renderDock();
  }
  function commit(mutate) {
    const before = JSON.stringify(S.draft);
    mutate(S.draft);
    S.draft = FX.content(S.draft);
    if (JSON.stringify(S.draft) === before) return;
    S.undo.push(before); if (S.undo.length > 100) S.undo.shift();
    S.redo = [];
    saveDraft();
    render();
  }
  function saveDraft() {
    store.set(LS_DRAFT, { draft: S.draft, baseline: S.baseline, savedAt: new Date().toISOString() });
  }

  $("list").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-act]");
    if (!b || !S.editing) return;
    const act = b.dataset.act;
    if (act === "add-live") return openAddLive();
    if (act === "add-custom") return openAddCustom();
    const id = b.closest("li[data-id]")?.dataset.id;
    commit((d) => {
      const i = d.entries.findIndex((x) => x.id === id);
      if (i < 0) return;
      if (act === "remove") d.entries.splice(i, 1);
      if (act === "up" && i > 0) [d.entries[i - 1], d.entries[i]] = [d.entries[i], d.entries[i - 1]];
      if (act === "down" && i < d.entries.length - 1) [d.entries[i + 1], d.entries[i]] = [d.entries[i], d.entries[i + 1]];
    });
    if (act === "remove") toast("已删除，可撤销");
  });

  function sitePanelInput(ev) {
    if (!S.editing) return;
    const t = ev.target;
    const d = S.draft;
    if (t.id === "fTitle") d.title = t.value;
    if (t.id === "fSub") d.subtitle = t.value;
    $("siteTitle").textContent = d.title || "人民币汇率台";
    $("siteSub").textContent = d.subtitle;
    saveDraft();
    renderDock();
  }
  $("sitePanel").addEventListener("input", sitePanelInput);
  $("sitePanel").addEventListener("change", (ev) => {
    if (["fTitle", "fSub"].includes(ev.target.id)) {
      S.draft = FX.content(S.draft); saveDraft();
      pushUndoFrom(S.fieldBefore); S.fieldBefore = JSON.stringify(S.draft);
    }
  });

  function undoRedo(from, to) {
    if (!from.length) return;
    to.push(JSON.stringify(S.draft));
    S.draft = JSON.parse(from.pop());
    saveDraft();
    render();
  }
  $("undoBtn").addEventListener("click", () => undoRedo(S.undo, S.redo));
  $("redoBtn").addEventListener("click", () => undoRedo(S.redo, S.undo));
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !$("overlay").hidden) { closeModal(); return; }
    if (!S.editing || !(ev.metaKey || ev.ctrlKey) || ev.key.toLowerCase() !== "z") return;
    if (ev.target.matches?.("input, textarea")) return;
    ev.preventDefault();
    undoRedo(ev.shiftKey ? S.redo : S.undo, ev.shiftKey ? S.undo : S.redo);
  });

  /* ---------- 解锁与锁定 ---------- */
  $("manageBtn").addEventListener("click", () => {
    if (S.editing) { S.editing = false; render(); toast(FX.diff(S.baseline.doc, S.draft).length ? "草稿已保存在本机，还没有发布" : "已退出编辑"); return; }
    if (S.unlocked || S.mode === "standalone") { S.unlocked = true; enterEdit(); return; }
    openUnlock();
  });
  $("draftBannerBtn").addEventListener("click", () => $("manageBtn").click());
  $("lockBtn").addEventListener("click", () => lock(shared() ? "已锁定，草稿保留在本机" : "已退出编辑"));

  function enterEdit() {
    const saved = store.get(LS_DRAFT);
    const pub = publishedContent();
    const rev = shared() ? (S.published?.revision || "") : "local";
    if (saved && saved.draft && saved.baseline) {
      S.draft = FX.content(saved.draft);
      S.baseline = { doc: FX.content(saved.baseline.doc), revision: saved.baseline.revision || "" };
    } else {
      S.draft = FX.clone(pub);
      S.baseline = { doc: FX.clone(pub), revision: rev };
    }
    S.editing = true; S.undo = []; S.redo = [];
    render();
  }

  function lock(msg) {
    S.unlocked = false; S.editing = false;
    if (S.gh) S.gh.setToken("");
    if (S.draft) saveDraft();
    closeModal();
    render();
    if (msg) toast(msg);
  }
  ["pointerdown", "keydown", "input"].forEach((t) => document.addEventListener(t, () => { S.lastActivity = Date.now(); }, { passive: true }));
  setInterval(() => {
    if (shared() && S.unlocked && Date.now() - S.lastActivity > IDLE_MS) lock("闲置 15 分钟，已自动锁定。草稿保留在本机");
    renderStatus();
  }, 30e3);

  async function openUnlock() {
    if (S.mode === "pages") return openUnlockPages();
    let lockDoc = null;
    try { const snap = await S.db.doc("secure/lock").get(); lockDoc = snap.exists ? snap.data() : null; }
    catch (e) { toast(dbMessage(e)); return; }
    if (!lockDoc) {
      openModal(`<h2 id="modalTitle">设置管理密码</h2>
        <p class="hint">第一次使用，先设一个管理密码。以后在任何设备上打开这个页面，输入密码就能修改并发布。</p>
        <form id="pwForm" class="grid" style="display:grid;gap:10px">
          <label class="field"><span>新密码（至少 6 位）</span><input id="pw1" type="password" autocomplete="new-password" required minlength="6"></label>
          <label class="field"><span>再输一次</span><input id="pw2" type="password" autocomplete="new-password" required></label>
          <p class="err" id="pwErr"></p>
          <div class="acts"><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">设定并开始编辑</button></div>
        </form>`);
      $("pwForm").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const a = $("pw1").value, b = $("pw2").value;
        if (a.length < 6) return ($("pwErr").textContent = "密码至少 6 位。");
        if (a !== b) return ($("pwErr").textContent = "两次输入的密码不一样。");
        try {
          await S.db.doc("secure/lock").set(await FX.makeLock(a));
          S.unlocked = true; closeModal(); enterEdit(); toast("管理密码已设定");
        } catch (e) { $("pwErr").textContent = dbMessage(e); }
      });
      return;
    }
    openModal(`<h2 id="modalTitle">输入管理密码</h2>
      <form id="pwForm" style="display:grid;gap:10px">
        <label class="field"><span>管理密码</span><input id="pw1" type="password" autocomplete="current-password" required></label>
        <p class="err" id="pwErr"></p>

      </form>`);
    $("pwForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const att = store.get(LS_ATT) || { n: 0, until: 0 };
      if (att.until > Date.now()) return ($("pwErr").textContent = `尝试次数太多，请 ${Math.ceil((att.until - Date.now()) / 1000)} 秒后再试。`);
      $("pwGo").disabled = true; $("pwErr").textContent = "正在验证…";

        $("pw1").select();
        return;
      }
      store.del(LS_ATT);
      S.unlocked = true; closeModal(); enterEdit();
    });

  /* ---------- GitHub Pages：令牌保管库 ---------- */
  async function loadVault(force) {
    if (S.vault !== undefined && !force) return S.vault;
    let v = null;
    try { v = (await S.gh.readJSON(VAULT_PATH, { auth: false }))?.data || null; }
    catch {
      try { const r = await fetch("./" + VAULT_PATH + "?t=" + Date.now(), { cache: "no-store" }); v = r.ok ? await r.json() : null; } catch { v = null; }
    }
    S.vault = v;
    return v;
  }

      <li>打开 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 新建细粒度令牌</a>（需要已登录 GitHub）。</li>
      <li>Token name 随便填，比如「汇率台」；Expiration 选最长 1 年。</li>
      <li>Repository access 选 <b>Only select repositories</b>，只勾 <b>${esc(REPO.split("/")[1] || "")}</b>。</li>
      <li>Permissions → Repository permissions → <b>Contents</b> 选 <b>Read and write</b>，其他不用动。</li>

  function openSetupPages(replacing) {
    openModal(`<h2 id="modalTitle">${replacing ? "修改密码 / 更换令牌" : "第一次设置"}</h2>
      <p class="hint">${replacing ? "可以只改密码（令牌留空），也可以换一个新令牌。" : "网站是静态页面，保存修改需要一个只能改这个仓库的 GitHub 令牌。令牌会用你设的密码在浏览器里加密后存进仓库，以后任何设备输入密码就能发布。只需要做一次。"}</p>
      ${replacing ? "" : TOKEN_STEPS}
      <form id="suForm" style="display:grid;gap:10px">
        ${replacing ? `<label class="field"><span>当前密码</span><input id="suOld" type="password" autocomplete="current-password" required></label>` : ""}
        <label class="field"><span>${replacing ? "新令牌（不换就留空）" : "GitHub 令牌"}</span><input id="suTok" type="password" autocomplete="off" placeholder="github_pat_…" ${replacing ? "" : "required"}></label>
        <label class="field"><span>${replacing ? "新密码（至少 8 位）" : "设一个管理密码（至少 8 位）"}</span><input id="suPw1" type="password" autocomplete="new-password" required></label>

        <div class="acts"><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit" id="suGo">${replacing ? "保存" : "完成设置并开始编辑"}</button></div>
      </form>`);
    $("suForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const err = $("suErr"), go = $("suGo");
      const pw = $("suPw1").value;
      if (pw !== $("suPw2").value) return (err.textContent = "两次输入的密码不一样。");
      const problem = GH.passwordProblem(pw);
      if (problem) return (err.textContent = problem);
      go.disabled = true; err.textContent = "正在检查令牌…";
      try {
        let token = $("suTok").value.trim();
        if (replacing && !token) token = await GH.open(await loadVault(true), $("suOld").value, REPO);
        else if (replacing) await GH.open(await loadVault(true), $("suOld").value, REPO); /* 换令牌也要先验证旧密码 */
        if (!GH.validToken(token)) throw Error("令牌格式不对：请使用 github_pat_ 开头的细粒度令牌。");
        S.gh.setToken(token);
        await S.gh.checkAccess();
        err.textContent = "正在加密并保存…";
        const sealed = await GH.seal(token, pw, REPO);
        const existing = await S.gh.readJSON(VAULT_PATH);
        await S.gh.writeJSON(VAULT_PATH, sealed, existing && existing.sha, replacing ? "更新编辑密码" : "设置编辑密码");
        S.vault = sealed;
        S.unlocked = true; closeModal();
        toast(replacing ? "已保存，其他设备下次解锁时使用新密码" : "设置完成");
        if (!replacing) { await refreshPublished(true).catch(() => {}); enterEdit(); }
      } catch (e) {
        if (!S.unlocked) S.gh.setToken("");
        go.disabled = false;
        err.textContent = e.message || "保存失败，请重试。";
      }
    });
  }

  /* ---------- 添加 ---------- */
  function openAddLive() {
    openModal(`<h2 id="modalTitle">添加货币</h2>
      <label class="field"><span>搜索中文名或代码</span><input id="q" placeholder="例如：泰铢、THB" autocomplete="off"></label>
      <div class="picker" id="pick"></div>
      <div class="acts"><button class="btn" type="button" data-close>关闭</button></div>`);
    const draw = () => {
      const q = $("q").value.trim().toLowerCase();
      const have = new Set(S.draft.entries.filter((e) => e.kind === "live").map((e) => e.code));
      const hits = FX.CATALOG.filter(([c, n]) => !q || c.toLowerCase().includes(q) || n.toLowerCase().includes(q));
      let html = hits.map(([c, n]) => `<button type="button" data-code="${c}" ${have.has(c) ? "disabled" : ""}><span class="code">${c}</span><span>${esc(n)}${have.has(c) ? "（已添加）" : ""}</span></button>`).join("");
      const raw = q.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (raw.length >= 3 && raw.length <= 6 && !FX.NAMES[raw]) html += `<button type="button" data-code="${raw}"><span class="code">${raw}</span><span>使用代码 ${raw}（来源支持时会显示汇率）</span></button>`;
      $("pick").innerHTML = html || `<p class="hint">没有找到。可以直接输入 3 位货币代码。</p>`;
    };
    $("q").addEventListener("input", draw);
    $("pick").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-code]");

      const entry = FX.liveEntry(b.dataset.code);
      commit((d) => d.entries.push(entry));
      closeModal(); flashRow(entry.id); toast(`已添加 ${entry.label}`);
    });
    draw();
